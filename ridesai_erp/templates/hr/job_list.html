{% extends "dashboard/hr_base.html" %}


{% block content %}


<h2>Job Posts</h2>


<a href="{% url 'hr:job-create' %}">
Add New Job
</a>


<br><br>


<table border="1" width="100%">


<tr>

<th>Title</th>
<th>Department</th>
<th>Status</th>
<th>Action</th>

</tr>


{% for job in jobs %}

<tr>

<td>
{{job.title}}
</td>


<td>
{{job.department}}
</td>


<td>
{{job.status}}
</td>


<td>

<a href="{% url 'hr:job-delete' job.id %}">
Delete
</a>

</td>


</tr>


{% empty %}

<tr>

<td colspan="4">
No Jobs Found
</td>

</tr>

{% endfor %}


</table>


{% endblock %}
