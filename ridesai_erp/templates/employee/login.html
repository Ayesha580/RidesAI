{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-4">

<h3>Employee Login</h3>

<form method="post">

{% csrf_token %}

<input

class="form-control mb-3"

name="username"

placeholder="Username">

<input

type="password"

class="form-control mb-3"

name="password"

placeholder="Password">

<button

class="btn btn-primary w-100">

Login

</button>

</form>

</div>

</div>

</div>

{% endblock %}
